<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Peyser's Studio</title>
    <!-- 网站 Favicon 图标 -->
    <link rel="icon" href="https://api.iconify.design/heroicons:sparkles-20-solid.svg?color=%23c084fc" type="image/svg+xml">
    <style>
        /* 全局基础重置 */
        * { box-sizing: border-box; margin: 0; padding: 0; transition: all 0.3s ease; }
        
        /* 奢华深紫微醺流光色彩渐变背景 */
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Segoe UI", Roboto, sans-serif; 
            background: linear-gradient(-45deg, #0d0614, #1a0826, #2d0c3f, #150921, #0a0410);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh; 
            display: flex; 
            flex-direction: column;
            color: #fff; 
            overflow-x: hidden;
            padding: 30px 20px;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* ------------------ 顶部栏布局 ------------------ */
        .header {
            width: 100%;
            max-width: 900px;
            margin: 0 auto 30px auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .brand-logo {
            font-size: 1.3rem;
            font-weight: 800;
            letter-spacing: -0.5px;
            background: linear-gradient(135deg, #ffffff 0%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            white-space: nowrap;
            text-decoration: none;
            cursor: pointer;
        }

        .brand-logo:hover {
            opacity: 0.85;
        }

        /* 轮播时钟容器 */
        .time-slider-container {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            padding: 6px 16px;
            border-radius: 30px;
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.2);
            height: 34px;
            overflow: hidden;
            position: relative;
            min-width: 200px;
        }

        .time-badge {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            opacity: 0;
            transform: translateY(100%);
            transition: transform 0.6s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.6s ease;
            pointer-events: none;
        }

        .time-badge.active {
            opacity: 1;
            transform: translateY(0);
            pointer-events: auto;
        }

        .time-badge.exit {
            opacity: 0;
            transform: translateY(-100%);
        }

        .time-label {
            font-size: 0.72rem;
            font-weight: 700;
            color: #c084fc;
            letter-spacing: 0.5px;
            background: rgba(192, 132, 252, 0.12);
            padding: 2px 6px;
            border-radius: 6px;
        }

        .time-val {
            font-family: -apple-system, BlinkMacSystemFont, "SF Mono", "Roboto Mono", "Segoe UI Mono", monospace;
            font-size: 0.82rem;
            font-weight: 500;
            letter-spacing: -0.2px;
            color: rgba(255, 255, 255, 0.9);
            font-variant-numeric: tabular-nums;
        }

        /* ------------------ 主体容器 & 顺序进场动画 ------------------ */
        .main-container {
            max-width: 800px;
            width: 100%;
            margin: 0 auto;
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 20px 0;
        }

        h1.hero-title {
            font-size: clamp(2rem, 5vw, 3.2rem);
            font-weight: 900;
            line-height: 1.25;
            letter-spacing: -0.5px;
            margin-bottom: 30px;
            background: linear-gradient(135deg, #ffffff 0%, #e9d5ff 40%, #c084fc 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 10px 30px rgba(0, 0, 0, 0.4);
            opacity: 0;
            transform: translateY(20px);
            animation: heroTitleIn 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.2s forwards;
        }

        @keyframes heroTitleIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .animate-content {
            opacity: 0;
            transform: translateY(25px);
            animation: contentFadeIn 0.8s cubic-bezier(0.16, 1, 0.3, 1) 0.8s forwards;
        }

        @keyframes contentFadeIn {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 搜索框组件 */
        .search-section {
            margin-bottom: 40px;
        }

        .engine-tabs {
            display: flex;
            gap: 12px;
            margin-bottom: 12px;
            padding-left: 4px;
        }

        .engine-tab {
            background: transparent;
            border: none;
            color: rgba(255, 255, 255, 0.5);
            font-size: 0.9rem;
            font-weight: 600;
            padding: 4px 0;
            cursor: pointer;
            position: relative;
        }

        .engine-tab.active {
            color: #c084fc;
        }

        .engine-tab.active::after {
            content: '';
            position: absolute;
            bottom: -2px;
            left: 0;
            width: 100%;
            height: 2px;
            background: #c084fc;
            border-radius: 2px;
        }

        .search-box {
            position: relative;
            display: flex;
            align-items: center;
        }

        .search-input {
            width: 100%;
            padding: 16px 22px;
            padding-right: 60px;
            font-size: 1.05rem;
            color: #fff;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 18px;
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            outline: none;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.25);
        }

        .search-input:focus {
            border-color: rgba(192, 132, 252, 0.5);
            background: rgba(255, 255, 255, 0.09);
            box-shadow: 0 8px 32px rgba(124, 58, 237, 0.25);
        }

        .search-btn {
            position: absolute;
            right: 10px;
            background: linear-gradient(135deg, #a855f7, #7c3aed);
            border: none;
            width: 40px;
            height: 40px;
            border-radius: 12px;
            color: white;
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            box-shadow: 0 4px 15px rgba(124, 58, 237, 0.4);
        }

        .search-btn:hover {
            transform: scale(1.05);
        }

        /* 快捷链接分栏 */
        .section-title {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            margin-bottom: 14px;
            letter-spacing: 1.5px;
            text-transform: uppercase;
            padding-left: 2px;
        }

        .nav-links {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 30px;
        }

        .nav-card {
            display: inline-flex;
            align-items: center;
            justify-content: space-between;
            gap: 8px;
            padding: 12px 20px;
            background: rgba(255, 255, 255, 0.04);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 14px;
            color: #fff;
            text-decoration: none;
            font-size: 0.92rem;
            font-weight: 500;
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.2);
            cursor: pointer;
            user-select: none;
        }

        .nav-card:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(192, 132, 252, 0.4);
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(124, 58, 237, 0.2);
        }

        /* 播客展开按钮的箭头标志 */
        .arrow-icon {
            font-size: 0.7rem;
            margin-left: 4px;
            color: rgba(255, 255, 255, 0.5);
            transition: transform 0.3s ease;
        }

        .nav-card.active .arrow-icon {
            transform: rotate(180deg);
            color: #c084fc;
        }

        /* 播客展开二级菜单容器 */
        .sub-nav-container {
            width: 100%;
            max-height: 0;
            overflow: hidden;
            transition: max-height 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
            opacity: 0;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .sub-nav-container.open {
            max-height: 80px;
            opacity: 1;
            margin-top: -4px;
            margin-bottom: 4px;
        }

        /* 二级菜单专属醒目对比样式 */
        .sub-nav-card {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.12), rgba(124, 58, 237, 0.18));
            border: 1px dashed rgba(192, 132, 252, 0.4);
            border-left: 3px solid #c084fc;
            padding: 10px 18px 10px 24px;
            border-radius: 10px;
            font-size: 0.88rem;
            color: #e9d5ff;
            width: fit-content;
        }

        .sub-nav-card:hover {
            background: linear-gradient(135deg, rgba(192, 132, 252, 0.22), rgba(124, 58, 237, 0.28));
            border-color: #c084fc;
            box-shadow: 0 4px 15px rgba(192, 132, 252, 0.3);
        }

        /* 页脚 */
        .footer {
            font-size: 0.85rem;
            color: rgba(255, 255, 255, 0.45);
            border-top: 1px solid rgba(255, 255, 255, 0.08);
            padding-top: 22px;
            margin-top: auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 12px;
        }

        .footer-left {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }

        .email-link {
            color: rgba(255, 255, 255, 0.85);
            text-decoration: none;
            border-bottom: 1px dashed rgba(255, 255, 255, 0.3);
        }

        .email-link:hover {
            color: #c084fc;
            border-bottom-color: #c084fc;
        }

        .copyright {
            color: rgba(255, 255, 255, 0.35);
        }

        .version-badge {
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 2px 8px;
            border-radius: 8px;
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            font-family: monospace;
        }

        /* ------------------ 响应式移动端适配 ------------------ */
        @media (max-width: 640px) {
            body {
                padding: 20px 16px;
            }

            .header {
                flex-direction: row;
                justify-content: space-between;
                align-items: center;
                margin-bottom: 25px;
            }

            .brand-logo {
                font-size: 1.15rem;
            }

            .time-slider-container {
                padding: 4px 12px;
                min-width: 170px;
                height: 30px;
            }

            .time-label {
                font-size: 0.65rem;
                padding: 1px 4px;
            }

            .time-val {
                font-size: 0.75rem;
            }

            .main-container {
                padding: 10px 0;
            }

            h1.hero-title {
                font-size: 1.8rem;
                margin-bottom: 22px;
            }

            .search-input {
                padding: 14px 18px;
                padding-right: 50px;
                font-size: 0.95rem;
                border-radius: 14px;
            }

            .search-btn {
                width: 36px;
                height: 36px;
                right: 8px;
                border-radius: 10px;
            }

            .nav-card {
                width: calc(50% - 6px);
                justify-content: center;
                padding: 12px 10px;
                font-size: 0.85rem;
            }

            .sub-nav-card {
                width: 100%;
            }

            .footer {
                flex-direction: column;
                align-items: flex-start;
                gap: 10px;
            }

            .footer-left {
                width: 100%;
                justify-content: space-between;
            }
        }
    </style>
</head>
<body>

    <!-- 顶部栏 -->
    <header class="header">
        <!-- 左上角标题点击返回主页 -->
        <a href="#" class="brand-logo">Peyser's Studio</a>
        
        <!-- 自动翻页交替展示 DE / CN 时间 -->
        <div class="time-slider-container">
            <div class="time-badge active" id="badge-de">
                <span class="time-label">DE</span>
                <span class="time-val" id="time-de">--.--.-- --:--:--</span>
            </div>
            <div class="time-badge" id="badge-cn">
                <span class="time-label">CN</span>
                <span class="time-val" id="time-cn">--.--.-- --:--:--</span>
            </div>
        </div>
    </header>

    <!-- 主体内容区域 -->
    <main class="main-container">

        <!-- 根据时间判定问候语的标题 -->
        <h1 class="hero-title" id="greeting-title">你好，今天想做点什么？</h1>

        <!-- 延时顺滑出现的下方内容组 -->
        <div class="animate-content">
            <!-- 搜索框 -->
            <div class="search-section">
                <div class="engine-tabs">
                    <button class="engine-tab active" id="tab-google" onclick="setEngine('google')">Google</button>
                    <button class="engine-tab" id="tab-baidu" onclick="setEngine('baidu')">百度</button>
                </div>
                <form id="search-form" action="https://www.google.com/search" method="get" target="_blank" class="search-box">
                    <input type="text" name="q" id="search-input" class="search-input" placeholder="输入搜索内容..." autofocus required autocomplete="off">
                    <button type="submit" class="search-btn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
                    </button>
                </form>
            </div>

            <!-- Studio Zone 类目（原 Bistro 已移至此处） -->
            <div class="section-title">Studio Zone</div>
            <div class="nav-links">
                <!-- Bistro (Beta) -->
                <a href="https://bistro.peyser.cn" class="nav-card" target="_blank">
                    <span>🍷 Bistro (Beta)</span>
                </a>
                <!-- 邮箱 -->
                <a href="https://qiye.163.com" class="nav-card" target="_blank">
                    <span>📧 邮箱</span>
                </a>
                <!-- 播客（含展开箭头） -->
                <div class="nav-card" id="podcast-parent-card" onclick="togglePodcastMenu(event)">
                    <span>🎙️ 播客</span>
                    <span class="arrow-icon">▼</span>
                </div>
                <!-- 文件（内部文件分享） -->
                <a href="#" class="nav-card" target="_blank">
                    <span>📁 文件</span>
                </a>

                <!-- 播客二级的子菜单列表（虚线边框+紫色高亮与一级拉开区别） -->
                <div class="sub-nav-container" id="podcast-sub-menu">
                    <a href="https://www.xiaoyuzhoufm.com/episode/6a226196b30e1571aea10be1?s=eyJ1IjoiNjZjMWI1YWJlZGNlNjcxMDRhZGZmZDY3In0%3D" class="nav-card sub-nav-card" target="_blank">
                        <span>🎙️ 下一站，没想好</span>
                    </a>
                </div>
            </div>

            <!-- 实用工具 -->
            <div class="section-title">实用工具</div>
            <div class="nav-links">
                <a href="https://gemini.google.com" class="nav-card" target="_blank">
                    <span>✨ Gemini</span>
                </a>
                <a href="https://chatgpt.com" class="nav-card" target="_blank">
                    <span>🤖 ChatGPT</span>
                </a>
                <a href="https://greenvideo.cc/" class="nav-card" target="_blank">
                    <span>🎬 视频提取</span>
                </a>
                <a href="https://vocalremover.org/zh/" class="nav-card" target="_blank">
                    <span>🎵 音频提取 / 伴奏分离</span>
                </a>
                <a href="https://www.flightradar24.com" class="nav-card" target="_blank">
                    <span>✈️ Flightradar24</span>
                </a>
                <a href="https://mail.proton.me" class="nav-card" target="_blank">
                    <span>🔒 Proton Mail</span>
                </a>
                <a href="https://www.17track.net/zh-cn" class="nav-card" target="_blank">
                    <span>📦 国际查件 (17TRACK)</span>
                </a>
            </div>

            <!-- 页脚 -->
            <footer class="footer">
                <div class="footer-left">
                    <div>有事找我？发个电邮：<a class="email-link" href="mailto:info@peyser.cn">info@peyser.cn</a></div>
                    <span class="version-badge">V1.0.1</span>
                </div>
                <div class="copyright">
                    © <span id="copyright-year"></span> Peyser's Studio. All rights reserved.
                </div>
            </footer>
        </div>
    </main>

    <!-- 交互脚本 -->
    <script>
        // 搜索引擎切换逻辑
        function setEngine(engine) {
            const form = document.getElementById('search-form');
            const input = document.getElementById('search-input');
            const tabGoogle = document.getElementById('tab-google');
            const tabBaidu = document.getElementById('tab-baidu');

            if (engine === 'google') {
                form.action = 'https://www.google.com/search';
                input.name = 'q';
                tabGoogle.classList.add('active');
                tabBaidu.classList.remove('active');
            } else {
                form.action = 'https://www.baidu.com/s';
                input.name = 'wd';
                tabBaidu.classList.add('active');
                tabGoogle.classList.remove('active');
            }
        }

        // 双时区时间获取逻辑
        function updateTime() {
            const now = new Date();

            const optionsDE = {
                timeZone: 'Europe/Berlin',
                year: '2-digit',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };

            const optionsCN = {
                timeZone: 'Asia/Shanghai',
                year: '2-digit',
                month: '2-digit',
                day: '2-digit',
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit',
                hour12: false
            };

            const formatterDE = new Intl.DateTimeFormat('zh-CN', optionsDE);
            const formatterCN = new Intl.DateTimeFormat('zh-CN', optionsCN);

            document.getElementById('time-de').innerText = formatterDE.format(now).replace(/\//g, '.');
            document.getElementById('time-cn').innerText = formatterCN.format(now).replace(/\//g, '.');
        }

        // 时间轮播逻辑 (每 3 秒交替上翻切换 DE / CN)
        let currentBadgeIndex = 0;
        function switchTimeBadge() {
            const badgeDE = document.getElementById('badge-de');
            const badgeCN = document.getElementById('badge-cn');

            if (currentBadgeIndex === 0) {
                badgeDE.classList.remove('active');
                badgeDE.classList.add('exit');
                badgeCN.classList.remove('exit');
                badgeCN.classList.add('active');
                currentBadgeIndex = 1;
            } else {
                badgeCN.classList.remove('active');
                badgeCN.classList.add('exit');
                badgeDE.classList.remove('exit');
                badgeDE.classList.add('active');
                currentBadgeIndex = 0;
            }

            setTimeout(() => {
                if (currentBadgeIndex === 0) {
                    badgeCN.classList.remove('exit');
                } else {
                    badgeDE.classList.remove('exit');
                }
            }, 600);
        }

        // 播客菜单二次展开/收起切换
        function togglePodcastMenu(event) {
            event.stopPropagation();
            const parentCard = document.getElementById('podcast-parent-card');
            const subMenu = document.getElementById('podcast-sub-menu');
            parentCard.classList.toggle('active');
            subMenu.classList.toggle('open');
        }

        // 根据本机当前时间动态设置问候语
        function updateGreeting() {
            const hour = new Date().getHours();
            let timeText = '你好';

            if (hour >= 0 && hour < 6) {
                timeText = '深夜了';
            } else if (hour >= 6 && hour < 11) {
                timeText = '早上好';
            } else if (hour >= 11 && hour < 13) {
                timeText = '中午好';
            } else if (hour >= 13 && hour < 18) {
                timeText = '下午好';
            } else {
                timeText = '晚上好';
            }

            document.getElementById('greeting-title').innerText = `${timeText}，今天想做点什么？`;
        }

        // 动态更新年份
        document.getElementById('copyright-year').innerText = new Date().getFullYear();

        // 页面初始化执行
        updateGreeting();
        updateTime();

        // 1秒刷新一次时间，3秒翻页一次
        setInterval(updateTime, 1000);
        setInterval(switchTimeBadge, 3000);
    </script>
</body>
</html>
